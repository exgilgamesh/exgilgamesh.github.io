<script src="/js/fullcalendar.min.js"></script>
<script>
(function () {
    // ==== 中文 locale（bundle 未内置 zh-cn，手动注册，精简自官方 locales/zh-cn.js）====
    FullCalendar.globalLocales.push({
        code: 'zh-cn',
        week: { dow: 1, doy: 4 },
        buttonText: { prev: '上月', next: '下月', today: '今天', year: '年', month: '月', week: '周', day: '日', list: '日程' },
        weekText: '周',
        allDayText: '全天',
        moreLinkText: function (n) { return '另外 ' + n + ' 个'; },
        noEventsText: '没有事件'
    });

    var TOKEN_KEY = 'gh_compose_token';
    var REPO = 'exgilgamesh/hexo-blog';
    var POSTS_PATH = 'source/_posts/';

    var tokenInput = document.getElementById('cal-token');
    var loadBtn = document.getElementById('cal-load');
    var statusEl = document.getElementById('cal-status');
    var calendarEl = document.getElementById('cal-calendar');
    var calendar = null;

    // 自动填充已保存的 Token
    (function () {
        try { tokenInput.value = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
    })();

    function setStatus(text, cls) {
        statusEl.textContent = text;
        statusEl.className = 'cal-status' + (cls ? ' ' + cls : '');
    }

    function apiHeaders(token) {
        var h = {
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
        };
        if (token) h['Authorization'] = 'Bearer ' + token;
        return h;
    }

    function handleRes(res, fallbackMsg) {
        if (res.ok) return res.json();
        return res.json().then(function (err) {
            var msg = (err && err.message) || fallbackMsg;
            if (res.status === 401) msg = 'Token 无效，请检查';
            if (res.status === 403) msg = 'Token 权限不足或无访问权限（需 Contents: Read）';
            if (res.status === 404) msg = '仓库或路径不存在，请检查 Token 权限';
            throw new Error(msg);
        });
    }

    // GitHub base64 内容解码（content 可能带换行）
    function decodeContent(content) {
        return decodeURIComponent(escape(atob(content.replace(/\n/g, ''))));
    }

    // 解析 front matter：---\ntitle: xxx\ndate: 2021-10-30 15:00:04\npermalink: /xxx/\n---
    function parseFrontMatter(md) {
        var info = { title: null, date: null, permalink: null };
        var m = md.match(/^---\s*\n([\s\S]*?)\n---/);
        var fm = m ? m[1] : '';
        function pick(re) {
            var r = fm.match(re);
            return r ? r[1].trim() : null;
        }
        var title = pick(/^title:\s*(.+)$/m);
        if (title) title = title.replace(/^['"]|['"]$/g, '').trim(); // 兼容带引号的 title
        info.title = title;
        info.date = pick(/^date:\s*(.+)$/m);
        info.permalink = pick(/^permalink:\s*(.+)$/m);
        return info;
    }

    // 文章 URL：有 permalink 用之，否则 /YYYY/MM/DD/文件名/
    function buildUrl(info, filename) {
        if (info.permalink) return info.permalink;
        var d = info.date.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (!d) return null;
        return '/' + d[1] + '/' + d[2] + '/' + d[3] + '/' + encodeURIComponent(filename.replace(/\.md$/i, '')) + '/';
    }

    // 分块并发拉取每篇文章，单个失败跳过不影响整体
    function fetchPosts(files, headers) {
        var events = [];
        var CHUNK = 10;
        function chunk(i) {
            if (i >= files.length) return Promise.resolve();
            return Promise.all(files.slice(i, i + CHUNK).map(function (f) {
                return fetch('https://api.github.com/repos/' + REPO + '/contents/' + encodeURIComponent(f.path), { headers: headers })
                    .then(function (res) { return res.ok ? res.json() : null; })
                    .then(function (data) {
                        if (!data || !data.content) return;
                        var info = parseFrontMatter(decodeContent(data.content));
                        if (!info.title || !info.date) return;
                        var d = info.date.match(/^(\d{4})-(\d{2})-(\d{2})/);
                        if (!d) return;
                        var url = buildUrl(info, f.name);
                        if (!url) return;
                        events.push({ title: info.title, start: d[1] + '-' + d[2] + '-' + d[3], url: url });
                    })
                    .catch(function () {});
            })).then(function () { return chunk(i + CHUNK); });
        }
        return chunk(0).then(function () {
            events.sort(function (a, b) { return a.start < b.start ? -1 : a.start > b.start ? 1 : 0; });
            return events;
        });
    }

    function renderCalendar(events) {
        if (!calendar) {
            calendar = new FullCalendar.Calendar(calendarEl, {
                initialView: 'dayGridMonth',
                locale: 'zh-cn',
                height: 'auto',
                headerToolbar: { left: 'prev,next', center: 'title', right: '' },
                initialDate: events.length ? events[events.length - 1].start : undefined,
                events: events,
                eventClick: function (info) {
                    if (info.event.url) {
                        info.jsEvent.preventDefault();
                        window.location.href = info.event.url;
                    }
                }
            });
            calendar.render();
        } else {
            // 已渲染过则只更新事件，保留当前视图
            calendar.removeAllEvents();
            calendar.addEventSource(events);
        }
    }

    // ==== 加载（公开仓库免 Token，自动读取全部文章）====
    function load() {
        var token = tokenInput.value.trim();
        if (token) { try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {} }

        loadBtn.disabled = true;
        setStatus('正在读取文章列表…', 'busy');

        fetch('https://api.github.com/repos/' + REPO + '/contents/' + encodeURIComponent(POSTS_PATH), { headers: apiHeaders(token) })
            .then(function (res) { return handleRes(res, '读取文章列表失败'); })
            .then(function (items) {
                var files = (items || []).filter(function (it) { return it.type === 'file' && /\.md$/i.test(it.name); });
                if (!files.length) { setStatus('未找到任何 .md 文章', 'err'); return; }
                setStatus('共 ' + files.length + ' 篇文章，正在读取内容…', 'busy');
                return fetchPosts(files, apiHeaders(token));
            })
            .then(function (events) {
                if (!events || !events.length) { setStatus('未解析到有效文章（缺少 date/title）', 'err'); return; }
                renderCalendar(events);
                setStatus('已加载 ' + events.length + ' 篇文章 ✓', 'ok');
            })
            .catch(function (e) {
                setStatus('加载失败：' + e.message, 'err');
            })
            .finally(function () { loadBtn.disabled = false; });
    }

    loadBtn.addEventListener('click', load);
    tokenInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') load(); });

    // 打开页面自动加载（公开仓库免 Token）
    load();
})();
</script>
