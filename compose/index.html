<script src="/js/easymde.min.js"></script>
<script>
(function () {
    var titleInput = document.getElementById('c-title');
    var dateInput = document.getElementById('c-date');
    var stats = document.getElementById('c-stats');
    var tokenInput = document.getElementById('c-token');
    var pubStatus = document.getElementById('c-pub-status');

    // ==== 工具函数 ====
    function nowStr() {
        var d = new Date();
        function p(n) { return (n < 10 ? '0' : '') + n; }
        return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
            ' ' + p(d.getHours()) + ':' + p(d.getMinutes()) + ':' + p(d.getSeconds());
    }
    function setStatus(text, cls) {
        pubStatus.textContent = text;
        pubStatus.className = 'compose-status' + (cls ? ' ' + cls : '');
    }
    function base64Unicode(str) { return btoa(unescape(encodeURIComponent(str))); }
    function base64Decode(b64) { return decodeURIComponent(escape(atob(b64.replace(/\n/g, '')))); }
    function slugify(s) {
        return s.trim().replace(/\s+/g, '-').replace(/[\\/:*?"<>|#]/g, '').slice(0, 60) || 'untitled';
    }
    function sanitizeName(name) {
        return name.replace(/[^\w.\u4e00-\u9fff-]/g, '_').replace(/\s+/g, '_');
    }
    var TOKEN_KEY = 'gh_compose_token';
    var PUB_REPO = 'exgilgamesh/hexo-blog';
    var PUB_BRANCH = 'main';
    function apiHeaders(token) {
        var h = {
            'Accept': 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
        };
        if (token) h['Authorization'] = 'Bearer ' + token;
        return h;
    }
    function apiUrl(path) {
        return 'https://api.github.com/repos/' + PUB_REPO + '/contents/' +
            path.split('/').map(encodeURIComponent).join('/');
    }
    function getToken() { return tokenInput.value.trim(); }

    (function () { try { tokenInput.value = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {} })();
    dateInput.value = nowStr();

    // ==== EasyMDE 编辑器 ====
    var mde = new EasyMDE({
        element: document.getElementById('c-input'),
        autofocus: false,
        spellChecker: false,
        autoDownloadFontAwesome: false,
        minHeight: '520px',
        placeholder: '在这里输入 Markdown…（可 Ctrl+V 直接粘贴图片）',
        status: ['words', 'lines', 'cursor'],
        previewClass: 'content',
        renderingConfig: { singleLineBreaks: false, codeSyntaxHighlighting: false },
        toolbar: [
            'bold', 'italic', 'heading', '|',
            'quote', 'code', 'unordered-list', 'ordered-list', '|',
            'link', 'image', '|',
            'preview', 'side-by-side', 'fullscreen', '|', 'guide'
        ],
        uploadImage: true,
        imagePathAbsolute: true,
        imageUploadFunction: function (file, onSuccess, onError) {
            uploadImage(file, onSuccess, onError);
        }
    });

    // 补上主题正文排版类(classList.add 不接受带空格类名,故分步添加)
    ['editor-preview', 'editor-preview-full', 'editor-preview-side'].forEach(function (cls) {
        var el = document.querySelector('.' + cls);
        if (el) { el.classList.add('content'); el.classList.add('markdown'); }
    });

    // ==== 预览状态同步 + 公式排版 ====
    // EasyMDE 2.18 只把 editor-preview-active/-side 加在预览元素上,容器缺失导致
    // CodeMirror 不隐藏、预览定位错乱(文字重叠)。这里同步类到容器,并触发 MathJax 排版。
    var mjTimer = null;
    function syncPreviewState() {
        var container = document.querySelector('.EasyMDEContainer');
        if (!container) return;
        var full = document.querySelector('.editor-preview-full');
        var side = document.querySelector('.editor-preview-side');
        container.classList.toggle('editor-preview-active',
            !!(full && full.classList.contains('editor-preview-active')));
        container.classList.toggle('editor-preview-active-side',
            !!(side && side.classList.contains('editor-preview-active-side')));
        // 公式排版(防抖)
        if (window.MathJax) {
            clearTimeout(mjTimer);
            mjTimer = setTimeout(function () {
                var els = [full, side].filter(function (el) { return el && getComputedStyle(el).display !== 'none'; });
                if (els.length) MathJax.Hub.Queue(['Typeset', MathJax.Hub].concat(els));
            }, 200);
        }
    }
    new MutationObserver(syncPreviewState).observe(
        document.querySelector('.EasyMDEContainer'),
        { attributes: true, subtree: true, attributeFilter: ['class'] }
    );
    // MathJax 异步加载完成后,若预览已显示则立即排版
    if (window.MathJax && MathJax.Hub) { syncPreviewState(); }
    window.addEventListener('load', syncPreviewState);

    function md() { return mde.value(); }

    // 统计
    function updateStats() {
        var text = md();
        var chars = text.length;
        var words = (text.match(/[\u4e00-\u9fff]/g) || []).length + (text.match(/[A-Za-z0-9]+/g) || []).length;
        var lines = text ? text.split('\n').length : 0;
        stats.textContent = chars + ' 字符 · ' + words + ' 词 · ' + lines + ' 行';
    }
    mde.codemirror.on('change', updateStats);
    updateStats();

    // ==== 图片上传（文件选择器按钮 + Ctrl+V 粘贴）====
    function uploadImage(file, onSuccess, onError) {
        var token = getToken();
        if (!token) { onError('请先填入 GitHub Token'); tokenInput.focus(); return; }
        if (!/^image\//.test(file.type)) { onError('只能上传图片文件'); return; }
        if (file.size > 5 * 1024 * 1024) { onError('图片不能超过 5MB'); return; }

        var ts = new Date();
        function p(n) { return (n < 10 ? '0' : '') + n; }
        var prefix = ts.getFullYear() + p(ts.getMonth() + 1) + p(ts.getDate()) + '-' + p(ts.getHours()) + p(ts.getMinutes()) + p(ts.getSeconds());
        var name = prefix + '-' + sanitizeName(file.name || 'image.png');
        var path = 'source/images/' + name;

        var reader = new FileReader();
        reader.onload = function () {
            var b64 = reader.result.split(',')[1];
            setStatus('图片上传中…', 'busy');
            fetch(apiUrl(path), {
                method: 'PUT',
                headers: apiHeaders(token),
                body: JSON.stringify({ message: 'Add image ' + name, content: b64, branch: PUB_BRANCH })
            }).then(function (res) {
                if (!res.ok) return res.json().then(function (e) { throw new Error(e.message || ('HTTP ' + res.status)); });
                setStatus('图片已上传 ✓', 'ok');
                onSuccess('/images/' + name);
            }).catch(function (e) {
                setStatus('图片上传失败：' + e.message, 'err');
                onError(e.message);
            });
        };
        reader.readAsDataURL(file);
    }

    // 粘贴图片
    document.addEventListener('paste', function (e) {
        var items = (e.clipboardData || {}).items || [];
        for (var i = 0; i < items.length; i++) {
            if (items[i].kind === 'file' && items[i].type.indexOf('image/') === 0) {
                var file = items[i].getAsFile();
                e.preventDefault();
                uploadImage(file, function (url) {
                    mde.codemirror.replaceSelection('![](' + url + ')');
                    updateStats();
                }, function () {});
                break;
            }
        }
    });

    // ==== 构建文章文件 ====
    function buildMd() {
        var title = titleInput.value.trim() || '未命名';
        var date = dateInput.value.trim() || nowStr();
        var body = md().trim();
        return '---\ntitle: "' + title.replace(/"/g, '\\"') + '"\ndate: ' + date + '\n---\n\n' + body + '\n';
    }

    // ==== 编辑模式：?file=source/_posts/xxx.md ====
    var editFile = null, editSha = null;
    var qs = new URLSearchParams(location.search);
    var fileParam = qs.get('file');
    if (fileParam) {
        // 公开仓库免 Token 读取；有 Token 则带上
        fetch(apiUrl(fileParam), { headers: apiHeaders(getToken()) })
            .then(function (r) {
                if (r.status === 401 || r.status === 403) {
                    return r.json().then(function (j) {
                        var err = new Error(j.message || ('HTTP ' + r.status));
                        err.__status = r.status;
                        throw err;
                    });
                }
                return r.ok ? r.json() : Promise.reject(new Error('加载失败 HTTP ' + r.status));
            })
            .then(function (data) {
                var text = base64Decode(data.content);
                editFile = fileParam;
                editSha = data.sha;
                var fm = text.split('---')[1] || '';
                var t = fm.match(/^title:\s*"?([^"\n]+)"?\s*$/m);
                var d = fm.match(/^date:\s*([^\n]+)\s*$/m);
                if (t) titleInput.value = t[1].trim();
                if (d) dateInput.value = d[1].trim();
                var body = text.replace(/^---[\s\S]*?---\s*/, '').trim();
                mde.value(body);
                updateStats();
                setStatus('正在编辑：' + fileParam.split('/').pop(), 'ok');
                document.title = '编辑 - ' + (t ? t[1].trim() : '');
            })
            .catch(function (e) { setStatus('加载失败：' + e.message, 'err'); });
    }

    // ==== 发布（新建或更新）====
    document.getElementById('c-publish').addEventListener('click', function () {
        var btn = this;
        var title = titleInput.value.trim();
        var mdText = buildMd();
        var token = getToken();

        if (!title) { setStatus('请先填写文章标题', 'err'); titleInput.focus(); return; }
        if (!mde.value().trim()) { setStatus('请先输入文章内容', 'err'); mde.codemirror.focus(); return; }
        if (!token) { setStatus('请先填入 GitHub Token', 'err'); tokenInput.focus(); return; }

        var path, payload;
        if (editFile && editSha) {
            path = editFile;
            payload = { message: 'Update: ' + title, content: base64Unicode(mdText), sha: editSha, branch: PUB_BRANCH };
        } else {
            path = 'source/_posts/' + slugify(title) + '.md';
            payload = { message: 'Post: ' + title, content: base64Unicode(mdText), branch: PUB_BRANCH };
        }

        btn.disabled = true;
        setStatus('提交中…', 'busy');
        fetch(apiUrl(path), {
            method: 'PUT',
            headers: apiHeaders(token),
            body: JSON.stringify(payload)
        }).then(function (res) {
            if (res.ok) {
                try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
                setStatus('已提交 ✓ 自动部署中（约 1-2 分钟上线）', 'ok');
                return res.json();
            }
            return res.json().then(function (err) {
                var msg = err.message || ('HTTP ' + res.status);
                if (res.status === 401) msg = 'Token 无效，请检查';
                if (res.status === 422) msg = editFile ? '更新失败（文件已变化，请刷新重试）' : '同名文章已存在，请换一个标题';
                throw new Error(msg);
            });
        }).catch(function (e) {
            setStatus('发布失败：' + e.message, 'err');
        }).finally(function () {
            btn.disabled = false;
        });
    });

    // ==== 复制 / 下载 / 清空 ====
    document.getElementById('c-copy').addEventListener('click', function () {
        var text = buildMd();
        function done() { this.textContent = '已复制 ✓'; var b = this; setTimeout(function () { b.textContent = '复制 Markdown'; }, 1500); }
        if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done.bind(this)).catch(function () { fallbackCopy(text); done.call(this); }.bind(this));
        } else { fallbackCopy(text); done.call(this); }
    });
    function fallbackCopy(text) {
        var ta = document.createElement('textarea');
        ta.value = text; document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        document.body.removeChild(ta);
    }

    document.getElementById('c-download').addEventListener('click', function () {
        var blob = new Blob([buildMd()], { type: 'text/markdown;charset=utf-8' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = slugify(titleInput.value || 'untitled') + '.md';
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); document.body.removeChild(a); }, 500);
        this.textContent = '已下载 ✓';
        var b = this; setTimeout(function () { b.textContent = '下载 .md'; }, 1500);
    });

    document.getElementById('c-clear').addEventListener('click', function () {
        if (mde.value() && !confirm('确定清空编辑器内容？')) return;
        mde.value(''); updateStats();
    });

    document.addEventListener('keydown', function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
            e.preventDefault();
            document.getElementById('c-download').click();
        }
    });
})();
</script>

/* 完整预览元素位于 CodeMirror 包装器内部,只能隐藏滚动区(visibility 保持布局),
